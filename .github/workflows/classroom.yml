# ─────────────────────────────────────────────────────────────────────
# CS++ Autograding Workflow — generated by the CS++ test builder.
# https://csplusplus.com/github · https://csplusplus.com/help/github-autograder
#
# CS++ installs this file at .github/workflows/classroom.yml in each
# student repo. Every push runs the tests below on GitHub Actions; the
# reporter publishes the score CS++ reads back into the gradebook, and
# the summary step renders a results table on the run's Summary tab.
# ─────────────────────────────────────────────────────────────────────
name: CS++ Autograding Tests
on:
  push:
  workflow_dispatch:
  repository_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !endsWith(github.actor, '[bot]')
    steps:
      - name: Check out student code
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 'findValue'
        id: findvalue
        uses: cs-plus-plus/autograding-command-grader@v1
        with:
          test-name: 'findValue'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="GridUtilsTest#findValue_*" test'
          timeout: 5
          max-score: 10

      - name: 'replaceAll'
        id: replaceall
        uses: cs-plus-plus/autograding-command-grader@v1
        with:
          test-name: 'replaceAll'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="GridUtilsTest#replaceAll_*" test'
          timeout: 5
          max-score: 10

      - name: 'mirrorHorizontal'
        id: mirrorhorizontal
        uses: cs-plus-plus/autograding-command-grader@v1
        with:
          test-name: 'mirrorHorizontal'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="GridUtilsTest#mirrorHorizontal_*" test'
          timeout: 5
          max-score: 10

      - name: 'mirrorVertical'
        id: mirrorvertical
        uses: cs-plus-plus/autograding-command-grader@v1
        with:
          test-name: 'mirrorVertical'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="GridUtilsTest#mirrorVertical_*" test'
          timeout: 5
          max-score: 10

      - name: 'rotate90CW'
        id: rotate90cw
        uses: cs-plus-plus/autograding-command-grader@v1
        with:
          test-name: 'rotate90CW'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="GridUtilsTest#rotate90CW_*" test'
          timeout: 5
          max-score: 10

      - name: 'invert'
        id: invert
        uses: cs-plus-plus/autograding-command-grader@v1
        with:
          test-name: 'invert'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="GridUtilsTest#invert_*" test'
          timeout: 5
          max-score: 10

      - name: 'threshold'
        id: threshold
        uses: cs-plus-plus/autograding-command-grader@v1
        with:
          test-name: 'threshold'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="GridUtilsTest#threshold_*" test'
          timeout: 5
          max-score: 10

      - name: 'average'
        id: average
        uses: cs-plus-plus/autograding-command-grader@v1
        with:
          test-name: 'average'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="GridUtilsTest#average_*" test'
          timeout: 5
          max-score: 10

      - name: 'countOccurrences'
        id: countoccurrences
        uses: cs-plus-plus/autograding-command-grader@v1
        with:
          test-name: 'countOccurrences'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="GridUtilsTest#countOccurrences_*" test'
          timeout: 5
          max-score: 10

      - name: 'blur3x3'
        id: blur3x3
        uses: cs-plus-plus/autograding-command-grader@v1
        with:
          test-name: 'blur3x3'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="GridUtilsTest#blur3x3_*" test'
          timeout: 5
          max-score: 10

      - name: Autograding Reporter
        uses: cs-plus-plus/autograding-grading-reporter@v1
        env:
          FINDVALUE_RESULTS: "${{steps.findvalue.outputs.result}}"
          REPLACEALL_RESULTS: "${{steps.replaceall.outputs.result}}"
          MIRRORHORIZONTAL_RESULTS: "${{steps.mirrorhorizontal.outputs.result}}"
          MIRRORVERTICAL_RESULTS: "${{steps.mirrorvertical.outputs.result}}"
          ROTATE90CW_RESULTS: "${{steps.rotate90cw.outputs.result}}"
          INVERT_RESULTS: "${{steps.invert.outputs.result}}"
          THRESHOLD_RESULTS: "${{steps.threshold.outputs.result}}"
          AVERAGE_RESULTS: "${{steps.average.outputs.result}}"
          COUNTOCCURRENCES_RESULTS: "${{steps.countoccurrences.outputs.result}}"
          BLUR3X3_RESULTS: "${{steps.blur3x3.outputs.result}}"
        with:
          runners: findvalue,replaceall,mirrorhorizontal,mirrorvertical,rotate90cw,invert,threshold,average,countoccurrences,blur3x3

      - name: CS++ Results Summary
        if: always()
        env:
          FINDVALUE_RESULTS: "${{steps.findvalue.outputs.result}}"
          REPLACEALL_RESULTS: "${{steps.replaceall.outputs.result}}"
          MIRRORHORIZONTAL_RESULTS: "${{steps.mirrorhorizontal.outputs.result}}"
          MIRRORVERTICAL_RESULTS: "${{steps.mirrorvertical.outputs.result}}"
          ROTATE90CW_RESULTS: "${{steps.rotate90cw.outputs.result}}"
          INVERT_RESULTS: "${{steps.invert.outputs.result}}"
          THRESHOLD_RESULTS: "${{steps.threshold.outputs.result}}"
          AVERAGE_RESULTS: "${{steps.average.outputs.result}}"
          COUNTOCCURRENCES_RESULTS: "${{steps.countoccurrences.outputs.result}}"
          BLUR3X3_RESULTS: "${{steps.blur3x3.outputs.result}}"
        run: |
          node <<'CSPP_SUMMARY'
          const fs = require('fs');
          const PASS = '\u2705', FAIL = '\u274c', WARN = '\u26a0\ufe0f';
          const fmt = (n) => (Math.round(n * 100) / 100).toString();
          const esc = (s) => String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\n/g, ' ');
          const keys = Object.keys(process.env).filter((k) => k.endsWith('_RESULTS')).sort();
          const rows = [];
          let earned = 0, possible = 0, passedCount = 0, testCount = 0;
          for (const key of keys) {
            const runner = key.slice(0, -8).toLowerCase();
            let data = null;
            try { data = JSON.parse(Buffer.from(process.env[key] || '', 'base64').toString('utf8')); } catch (e) {}
            if (!data || !Array.isArray(data.tests) || data.tests.length === 0) {
              rows.push('| ' + WARN + ' | `' + esc(runner) + '` | no result |');
              continue;
            }
            const max = Number(data.max_score) || 0;
            let rEarned = 0, rPassed = 0;
            for (const t of data.tests) {
              if (t.status === 'pass') rPassed += 1;
              rEarned += Number(t.score) || 0;
            }
            if (max > 0 && rEarned === 0 && rPassed > 0) {
              rEarned = (rPassed / data.tests.length) * max;
            }
            if (rEarned > max && max > 0) rEarned = max;
            earned += max > 0 ? rEarned : 0;
            possible += max;
            passedCount += rPassed;
            testCount += data.tests.length;
            if (data.tests.length === 1) {
              const t = data.tests[0];
              const icon = t.status === 'pass' ? PASS : FAIL;
              rows.push('| ' + icon + ' | ' + esc(t.name || runner) + ' | ' + (max > 0 ? fmt(rEarned) + ' / ' + fmt(max) : '\u2014') + ' |');
            } else {
              for (const t of data.tests) {
                rows.push('| ' + (t.status === 'pass' ? PASS : FAIL) + ' | ' + esc(t.name || runner) + ' | |');
              }
              rows.push('| ' + (rPassed === data.tests.length ? PASS : FAIL) + ' | **' + esc(runner) + ' subtotal** | ' + (max > 0 ? fmt(rEarned) + ' / ' + fmt(max) : '\u2014') + ' |');
            }
          }
          const md = [
            '## \ud83c\udf93 CS++ Autograder Results',
            '',
            '| | Test | Points |',
            '|---|---|---:|',
            ...rows,
            '',
            '**Total: ' + fmt(earned) + ' / ' + fmt(possible) + ' points** \u00b7 ' + passedCount + ' of ' + testCount + ' tests passed',
            '',
          ].concat(possible > 0 ? [] : [
            WARN + ' No points are configured, so no score reports to the CS++ gradebook.',
            '',
          ]).concat([
            'Scores sync automatically to the CS++ gradebook \u2014 per-test detail appears on your CS++ dashboard.',
            '',
            '_Autograded by [CS++ Classroom for GitHub](https://csplusplus.com/github)_',
            '',
          ]).join('\n');
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          }
          CSPP_SUMMARY
